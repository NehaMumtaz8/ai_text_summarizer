<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Summarizer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ── ORIGINAL DESIGN — completely preserved ── */
        :root {
            --primary-violet: #e11d48;
            --secondary-purple: #4c0519;
            --accent-cyan: #fda4af;
            --bg-deep: #0a0101;
            --glass: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }

        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-deep); color: white;
            overflow: hidden; position: relative;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .nebula { position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.3; animation: drift 20s infinite alternate ease-in-out; }
        .nebula-1 { width: 500px; height: 500px; background: var(--primary-violet); top: -10%; left: -10%; }
        .nebula-2 { width: 400px; height: 400px; background: var(--secondary-purple); bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes drift {
            from { transform: translate(0,0) rotate(0deg) scale(1); }
            to   { transform: translate(50px,100px) rotate(30deg) scale(1.2); }
        }

        .container { position: relative; z-index: 10; width: 100%; display: flex; justify-content: center; padding: 20px; }

        .card {
            width: 100%; max-width: 440px;
            background: rgba(20,5,5,0.7);
            border: 1px solid var(--border);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 40px; padding: 50px; text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }

        .card::before {
            content: ""; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, var(--primary-violet), transparent);
            animation: rotateGlow 6s linear infinite; z-index: -1;
        }

        @keyframes rotateGlow { 100% { transform: rotate(360deg); } }

        .card-inner { background: #0d0202; border-radius: 38px; margin: -48px; padding: 48px; }

        h2 {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(to right, #fff, var(--accent-cyan));
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px; letter-spacing: -1px;
        }

        .subtitle { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 30px; line-height: 1.6; }

        .input-group { margin-bottom: 15px; position: relative; }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%; padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; color: white; font-size: 14px;
            outline: none; transition: 0.4s;
        }

        input:focus {
            background: rgba(225,29,72,0.1);
            border-color: var(--primary-violet);
            box-shadow: 0 0 20px rgba(225,29,72,0.2);
        }

        .show-pass {
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; color: rgba(255,255,255,0.6);
            cursor: pointer; margin: 10px 0 20px; justify-content: flex-start;
        }
        .show-pass input { width: auto; accent-color: var(--primary-violet); }

        .btn-main {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-violet), var(--secondary-purple));
            color: white; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: 0.3s; box-shadow: 0 10px 30px rgba(225,29,72,0.3);
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(225,29,72,0.5); filter: brightness(1.1); }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .msg-box {
            display: none; padding: 12px 16px; border-radius: 12px;
            font-size: 13px; font-weight: 500; margin-bottom: 16px;
            text-align: left; line-height: 1.5;
        }
        .msg-box.error   { background: rgba(225,29,72,0.15); border: 1px solid rgba(225,29,72,0.4); color: #fda4af; }
        .msg-box.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }

        .link-box { margin-top: 25px; font-size: 14px; color: rgba(255,255,255,0.4); }
        .link-box a { color: var(--accent-cyan); text-decoration: none; font-weight: 600; }
        .link-box a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <canvas id="bg-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>

    <div class="container">
        <div class="card">
            <div class="card-inner">
                <h2>Signup AI Summarizer</h2>
                <p class="subtitle">Elevate your productivity with next-gen<br>AI intelligence.</p>

                <!-- Message box -->
                <div class="msg-box" id="msgBox"></div>

                <!-- Signup form -->
                <form id="signupForm">
                    <div class="input-group">
                        <input type="text" id="name" placeholder="Full Name" required autocomplete="name">
                    </div>
                    <div class="input-group">
                        <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Create Password" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
                    </div>

                    <label class="show-pass">
                        <input type="checkbox" onchange="togglePassword()"> Show Passwords
                    </label>

                    <button type="submit" class="btn-main" id="signupBtn">Create Account</button>
                </form>

                <div class="link-box" style="margin-top: 20px;">
                    Already a member? <a href="/login">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/storage.js"></script>
    <script>
        // ── 3D Shard background ───────────────────────────────────────
        const canvas = document.getElementById('bg-canvas');
        const ctx    = canvas.getContext('2d');
        let shards   = [];

        function initCanvas() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            shards = [];
            for (let i = 0; i < 45; i++) {
                shards.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 50 + 15,
                    speedX: (Math.random() - 0.5) * 0.4,
                    speedY: (Math.random() - 0.5) * 0.4,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.008,
                    color: i % 2 === 0 ? "rgba(225,29,72,0.08)" : "rgba(76,5,25,0.12)"
                });
            }
        }

        function animate() {
            ctx.fillStyle = "#0a0101";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            shards.forEach(s => {
                s.x += s.speedX; s.y += s.speedY; s.rotation += s.rotationSpeed;
                if (s.x < -s.size) s.x = canvas.width + s.size;
                if (s.x > canvas.width + s.size) s.x = -s.size;
                if (s.y < -s.size) s.y = canvas.height + s.size;
                if (s.y > canvas.height + s.size) s.y = -s.size;
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.rotation);
                ctx.fillStyle   = s.color;
                ctx.strokeStyle = "rgba(225,29,72,0.15)";
                ctx.lineWidth   = 1;
                ctx.beginPath();
                ctx.moveTo(0, -s.size);
                ctx.lineTo(s.size, s.size);
                ctx.lineTo(-s.size, s.size);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        animate();

        // ── UI helpers ────────────────────────────────────────────────
        function showMsg(type, text) {
            const box       = document.getElementById('msgBox');
            box.className   = `msg-box ${type}`;
            box.textContent = text;
            box.style.display = "block";
        }

        function togglePassword() {
            const t = document.getElementById("password").type === "password" ? "text" : "password";
            document.getElementById("password").type = t;
            document.getElementById("confirmPassword").type = t;
        }

        // ── Signup form submission (Local Storage — no server call) ───
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name            = document.getElementById("name").value.trim();
            const email           = document.getElementById("email").value.trim();
            const password        = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const btn             = document.getElementById("signupBtn");

            if (password !== confirmPassword) {
                showMsg("error", "Passwords do not match. Please try again.");
                return;
            }
            if (password.length < 6) {
                showMsg("error", "Password must be at least 6 characters.");
                return;
            }

            btn.disabled    = true;
            btn.textContent = "Creating account…";

            const result = signupUser({ name, email, password });

            if (result.error) {
                showMsg("error", result.error);
            } else {
                showMsg("success", "Account created! Redirecting to login…");
                setTimeout(() => location.href = "/login", 900);
            }

            btn.disabled    = false;
            btn.textContent = "Create Account";
        });
    </script>
</body>
</html>
